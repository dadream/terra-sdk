name: Terra SDK Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/miniprogram-sdk
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  sdk-release-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The desktop oracle verifies that its baseline commit is an ancestor.
          fetch-depth: 0

      - name: Build canonical native image
        run: bash scripts/build_docker_image.sh

      - name: Run native, service, Wasm, package, and Web evidence gates
        run: bash scripts/verify_sdk_release.sh

      - name: Verify tagged release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python3 scripts/verify_sdk_release_metadata.py
          --tag "${GITHUB_REF_NAME}"
          --release-dir workspace_old/package/release

      - name: Upload release packages and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-sdk-release-evidence
          if-no-files-found: warn
          path: |
            workspace_old/package/release/*.tar.gz
            workspace_old/package/release/SHA256SUMS
            workspace_old/package/release/release_manifest.json
            workspace_old/package/release/*.spdx.json
            viewer_verify_output/sdk_release_verify.log
            viewer_verify_output/web_sdk/report.html
            viewer_verify_output/web_sdk/report.json
            viewer_verify_output/web_sdk/summary.json

      - name: Stage tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: terra-sdk-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            workspace_old/package/release/*.tar.gz
            workspace_old/package/release/SHA256SUMS
            workspace_old/package/release/release_manifest.json
            workspace_old/package/release/*.spdx.json

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: sdk-release-gate
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: terra-sdk-release-assets
          path: release-assets

      - name: Publish immutable developer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "${notes}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing replacement." >&2
            exit 1
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 5
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --prerelease \
            --title "Terra SDK ${GITHUB_REF_NAME} Developer Preview" \
            --notes-file "${notes}"
